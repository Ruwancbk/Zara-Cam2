name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Arrange files
        run: |
          mkdir -p www
          cp zara-cam.html www/index.html
          cp logo.png www/
      - run: npm install
      - name: Add backup plugins
        run: npm install @capacitor/filesystem@^6 @capacitor/share@^6
      - run: npx cap add android
      - name: Use permanent signing key
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -z "$KS" ]; then
            echo "KEYSTORE_B64 නැහැ - තාවකාලික key එකක් භාවිතා කරයි"
          else
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android | grep -i androiddebugkey
          fi
      - name: Put logo as app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          src = Image.open('icon.png').convert('RGBA')
          res = 'android/app/src/main/res'
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for d, s in sizes.items():
              folder = os.path.join(res, 'mipmap-' + d)
              os.makedirs(folder, exist_ok=True)
              white = Image.new('RGBA', (s, s), 'white')
              logo = src.resize((s, s), Image.LANCZOS)
              white.alpha_composite(logo)
              white.convert('RGB').save(os.path.join(folder, 'ic_launcher.png'))
              mask = Image.new('L', (s * 4, s * 4), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, s * 4 - 1, s * 4 - 1), fill=255)
              mask = mask.resize((s, s), Image.LANCZOS)
              rnd = Image.new('RGBA', (s, s), (0, 0, 0, 0))
              rnd.paste(white, (0, 0), mask)
              rnd.save(os.path.join(folder, 'ic_launcher_round.png'))
              fs = int(s * 108 / 48)
              fg = Image.new('RGBA', (fs, fs), (0, 0, 0, 0))
              inner = int(fs * 0.62)
              lg = src.resize((inner, inner), Image.LANCZOS)
              fg.alpha_composite(lg, ((fs - inner) // 2, (fs - inner) // 2))
              fg.save(os.path.join(folder, 'ic_launcher_foreground.png'))
          vals = os.path.join(res, 'values')
          os.makedirs(vals, exist_ok=True)
          open(os.path.join(vals, 'ic_launcher_background.xml'), 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>\n')
          print('icons done')
          PY
      - name: Allow camera
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "CAMERA" android/app/src/main/AndroidManifest.xml
      - name: Raise version number
        run: |
          sed -i "s/versionCode [0-9]*/versionCode $((${{ github.run_number }} + 10))/" android/app/build.gradle
          grep -n "versionCode" android/app/build.gradle
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: zara-cam-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
